<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendence Tracker</title>

<link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Attendance Tracker</h1>
        <p class="subtitle">Track your attendance easily</p>
        <div class="overall-box">
            <h2>Overall Attendance</h2>
            <div id="overallAttendance">0%</div>
        </div>

        <div class="dashboard-card">
                <h3>Total Subjects</h3>
                <p id="totalSubjects">0</p>
            </div>

        

<div class="dashboard-card">
    <h3>Good Attendance</h3>
    <p id="goodSubjects">0</p>
</div>

<div class="dashboard-card">
    <h3>Needs Attention</h3>
    <p id="lowSubjects">0</p>
</div>

<div class="add-subject"> 
    <h2>Add Subject</h2>

    <input type="text" id="subjectName" placeholder="Subject Name">
    <button onclick="addSubject()">Add Subject</button>
    </div>

    <div id="subjectsContainer">
        <!--Subjects will appear here-->
    </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
